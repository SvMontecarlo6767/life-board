<!DOCTYPE html>
<html lang="de" data-hud><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life Board"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#04080f">
<title>Überblick – Life Board</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e2e0d8;--ac:#2f6f4f;--ac2:#e8f2ec;--bad:#b3413a;--bad2:#f8e9e7}
@media (prefers-color-scheme:dark){:root{--bg:#161715;--card:#20211f;--tx:#eeede8;--mu:#a09f97;--bd:#34352f;--ac:#6fbf94;--ac2:#243128;--bad:#e07a72;--bad2:#33201e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:8px 16px 90px}
a{color:var(--ac)}
button{font:inherit;color:var(--tx);background:var(--ac2);border:1px solid var(--bd);border-radius:12px;padding:8px 14px;cursor:pointer;min-height:44px}
[hidden]{display:none!important}
h1{margin:4px 0 0;font-size:22px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.mu{color:var(--mu);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:6px 16px;margin:12px 0}
.card h3{margin:12px 0 2px;font-size:13px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.it,html[data-hud] a.it{display:block;text-decoration:none;color:var(--tx);padding:12px 0;border-top:1px solid var(--bd)}
.it:first-of-type{border-top:0}
.it b{display:block;font-size:16.5px;line-height:1.3}
.it p{margin:4px 0 0;font-size:15px;opacity:.9}
.it small{display:block;margin-top:4px;color:var(--mu);font-size:12.5px}
.it.read b{opacity:.65}
.info{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--ac2);border:1px solid var(--bd);font-size:14px}
.info.warn{background:var(--bad2);color:var(--bad)}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.toc a{font-size:13px;text-decoration:none;color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:6px 12px;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.toc a em{font-style:normal;color:var(--mu)}
.card.top .it b{font-size:19px}
.card.top .it p{font-size:15.5px;line-height:1.55}
.it .more{display:inline-block;margin-top:4px;font-size:13px;color:var(--ac)}
.src{font-size:12.5px;color:var(--mu);margin-top:8px;line-height:1.6}
</style><script>try{var t=JSON.parse(localStorage.getItem('lb_ui')||'{}').theme;if(t&&t!=='cockpit')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script><link rel="stylesheet" href="theme.css?v=10">
</head><body><div class="wrap">
<div class="top"><div><a href="index.html" class="mu" style="text-decoration:none">← Life Board</a><h1>📰 Überblick</h1><div class="mu" id="sub">wird geladen …</div></div><button id="ref" aria-label="Neu laden">↻</button></div>
<div id="msg"></div>
<div id="main"></div>
<div class="src" id="src"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="fb.js"></script>
<script>
(async function(){
const WORKER='https://life-board-whoop.momo-haskamp.workers.dev';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CK='lb_news',RK='lb_news_read';
let user=null;
const hm=t=>new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const when=t=>{if(!t)return'';const d=new Date(t),today=new Date();return (d.toDateString()===today.toDateString()?'':d.toLocaleDateString('de-DE',{weekday:'short'})+' ')+hm(t)};
function read(){try{return JSON.parse(localStorage.getItem(RK)||'{}')}catch(e){return{}}}
function markRead(u){try{const r=read();r[u]=Date.now();const cut=Date.now()-4*864e5;Object.keys(r).forEach(k=>{if(r[k]<cut)delete r[k]});localStorage.setItem(RK,JSON.stringify(r))}catch(e){}}
/* Meldungen anzeigen: pro Bereich Schlagzeile, Kurztext, Quelle und Uhrzeit; Antippen öffnet den Artikel */
function show(N){
  if(!N||!N.sections){return}
  const r=read();
  $('sub').textContent=new Date(N.at).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})+' · '+N.n+' Meldungen · ca. '+N.minutes+' Min'+(N.stale?' · älterer Stand':'');
  const S=N.sections.filter(s=>s.items.length);
  $('main').innerHTML=(S.length>1?'<nav class="toc" aria-label="Bereiche">'+S.map(s=>'<a href="#n-'+esc(s.id)+'">'+esc(s.title)+' <em>'+s.items.length+'</em></a>').join('')+'</nav>':'')
    +S.map(s=>'<section class="card'+(s.id==='top'?' top':'')+'" id="n-'+esc(s.id)+'"><h3>'+esc(s.title)+'</h3>'+s.items.map(x=>'<a class="it'+(r[x.url]?' read':'')+'" '+(x.url?'href="'+esc(x.url)+'" target="_blank" rel="noopener"':'')+' data-u="'+esc(x.url)+'"><b>'+esc(x.t)+'</b>'+(x.s?'<p>'+esc(x.s)+'</p>':'')+'<small>'+esc(x.src||'')+(x.time?' · '+when(x.time):'')+(x.url?' · <span class="more">ganzer Artikel ›</span>':'')+'</small></a>').join('')+'</section>').join('')||'<div class="info">Gerade keine Meldungen. Später nochmal versuchen.</div>';
  $('main').querySelectorAll('[data-u]').forEach(a=>a.addEventListener('click',()=>{if(a.dataset.u){markRead(a.dataset.u);a.classList.add('read')}}));
  const bad=(N.sources||[]).filter(x=>!x.ok).map(x=>x.name);
  $('src').innerHTML='Quellen: tagesschau.de, ZDFheute, Deutsche Welle, heise online. Texte von den Redaktionen, ohne KI.'+(bad.length?'<br>Gerade nicht erreichbar: '+esc([...new Set(bad)].join(', '))+' (die anderen Quellen reichen aus).':'');
}
async function load(force){
  $('ref').disabled=true;
  try{
    const t=await user.getIdToken();
    const r=await Promise.race([fetch(WORKER+'/news'+(force?'?refresh=1':''),{headers:{Authorization:'Bearer '+t}}),new Promise((_,j)=>setTimeout(()=>j(new Error('Zeitüberschreitung')),20000))]);
    const d=await r.json();if(!r.ok)throw new Error(d.error||('Fehler '+r.status));
    show(d);$('msg').innerHTML='';try{localStorage.setItem(CK,JSON.stringify(d))}catch(e){}
  }catch(e){$('msg').innerHTML='<div class="info warn">Neuer Stand nicht ladbar: '+esc(e.message)+(localStorage.getItem(CK)?' – du siehst den zuletzt geladenen.':'')+'</div>'}
  $('ref').disabled=false;window.__newsReady=true;
}
try{const c=JSON.parse(localStorage.getItem(CK)||'null');if(c)show(c)}catch(e){}   // sofort der letzte Stand, dann frisch
user=await new Promise(res=>{let done=false;auth.onAuthStateChanged(u=>{if(!done){done=true;res(u)}});setTimeout(()=>{if(!done){done=true;res(auth.currentUser)}},8000)});
if(!user){$('msg').innerHTML='<div class="info warn">Du bist nicht angemeldet. <a href="index.html">Zur Startseite und anmelden</a></div>';return}
$('ref').onclick=()=>load(true);
load(false);
})();
</script>
<script src="theme.js?v=16"></script>
</body></html>
