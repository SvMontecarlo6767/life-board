<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daten importieren</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e2e0d8;--ac:#2f6f4f;--ac2:#e8f2ec;--bad:#b3413a}
@media (prefers-color-scheme:dark){:root{--bg:#161715;--card:#20211f;--tx:#eeede8;--mu:#a09f97;--bd:#34352f;--ac:#6fbf94;--ac2:#243128;--bad:#e07a72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding:clamp(14px,4vw,32px)}
main{max-width:640px;margin:0 auto}
a.back{color:var(--mu);text-decoration:none;font-size:13.5px}
h1{font-size:24px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
button{font:inherit;color:#fff;background:var(--ac);border:1px solid var(--ac);border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:600}
button:disabled{opacity:.4}
input[type=file]{display:block;margin:10px 0;width:100%}
pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;margin:0}
.ok{color:var(--ac);font-weight:700}.bad{color:var(--bad);font-weight:700}
</style></head><body><main>
<a class="back" href="index.html">← Life Board</a>
<h1>Alte Puzzle-Daten importieren</h1>
<div class="card">
  <p style="margin-top:0">Wähle die Sicherungsdatei <b>puzzle-sicherung.json</b>. Vorhandene Einträge werden nur überschrieben, wenn die Datei neuer ist. Danach wird alles zurückgelesen und mit der Datei verglichen.</p>
  <input type="file" id="file" accept=".json,application/json">
  <button id="go" disabled>Importieren</button>
</div>
<div class="card"><pre id="log">Noch nichts passiert.</pre></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="fb.js"></script>
<script>
const $=id=>document.getElementById(id);
const log=(m,c)=>{const l=$('log');l.innerHTML+=(l.dataset.f?'\n':'')+(c?'<span class="'+c+'">'+m+'</span>':m);l.dataset.f=1};
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(x=>[x,v[x]])):v);
let DATA=null,USER=null;
requireUser().then(u=>{USER=u;});
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    DATA=JSON.parse(await f.text());
    if(DATA.collections){ // Format der Hub-Sicherung (v2): nur das Puzzle-Modul wird hier eingespielt
      const pz=DATA.collections.puzzle||{},days={},docs={};
      Object.entries(pz).forEach(([id,v])=>(id.startsWith('__')?docs:days)[id]=v);
      DATA={v:1,days,docs};
    }
    const days=Object.keys(DATA.days||{}).length,extra=Object.keys(DATA.docs||{});
    if(!days)throw new Error('keine Tage in der Datei');
    $('log').textContent='';delete $('log').dataset.f;
    log('Datei gelesen: '+days+' Tage, Zusatzdokumente: '+(extra.join(', ')||'keine'));
    $('go').disabled=false;
  }catch(err){DATA=null;$('go').disabled=true;$('log').textContent='';delete $('log').dataset.f;log('Datei nicht lesbar: '+err.message,'bad')}
};
$('go').onclick=async()=>{
  if(!DATA||!USER)return;
  $('go').disabled=true;
  const col=fs.collection('users/'+USER.uid+'/puzzle');
  const all={};Object.entries(DATA.days).forEach(([id,v])=>all[id]=v);Object.entries(DATA.docs||{}).forEach(([id,v])=>all[id]=v);
  const total=Object.keys(all).length;
  try{
    log('Bitte diese Seite im Vordergrund lassen, bis "Fertig" erscheint.');
    log('Lese vorhandene Cloud-Daten …');
    const ex={};(await col.get()).docs.forEach(d=>ex[d.id]=d.data());
    log('In der Cloud liegen bisher '+Object.keys(ex).length+' Dokumente.');
    const todo=[];let skipped=0;
    for(const [id,v] of Object.entries(all)){
      const cur=ex[id];
      // Tage: neuere Cloud-Einträge nie überschreiben. Zusatzdokumente (__...) sind abgeleiteter Stand und werden aus der Sicherung gesetzt.
      if(cur&&!id.startsWith('__')&&(cur.t||0)>(v.t||0)&&canon(cur)!==canon(v)){skipped++;log('übersprungen (Cloud ist neuer): '+id);continue}
      todo.push([id,v]);
    }
    log('Schreibe '+todo.length+' von '+total+' Dokumenten in einem Schritt …');
    for(let i=0;i<todo.length;i+=400){
      const batch=fs.batch();
      todo.slice(i,i+400).forEach(([id,v])=>batch.set(col.doc(id),v));
      await batch.commit();
    }
    log('Geschrieben: '+todo.length+', übersprungen: '+skipped);
    log('Kontrolle: lese alles zurück …');
    const back={};(await col.get({source:'server'})).docs.forEach(d=>back[d.id]=d.data());
    let same=0;const diff=[];
    for(const [id,v] of todo){ if(back[id]&&canon(back[id])===canon(v))same++;else diff.push(id) }
    const days=Object.keys(back).filter(k=>!k.startsWith('__')).length;
    if(!diff.length)log('✓ Fertig. '+same+' geschriebene Dokumente stimmen überein. In der Cloud liegen jetzt '+days+' Tage.','ok');
    else {log('Abweichungen bei: '+diff.join(', '),'bad');$('go').disabled=false}
  }catch(err){log('Fehler: '+(err.code||'')+' '+(err.message||''),'bad');$('go').disabled=false}
};
</script></main></body></html>
