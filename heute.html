<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heute – Life Board</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e2e0d8;--ac:#2f6f4f;--ac2:#e8f2ec;--bad:#b3413a;--bad2:#f8e9e7;--warn:#9a6b00;--gold:#b8860b;
 --rS:#b8860b;--rA:#2f6f4f;--rB:#3b6ea5;--rC:#8a8981}
@media (prefers-color-scheme:dark){:root{--bg:#161715;--card:#20211f;--tx:#eeede8;--mu:#a09f97;--bd:#34352f;--ac:#6fbf94;--ac2:#243128;--bad:#e07a72;--bad2:#33201e;--warn:#e0b04a;--gold:#e6c35c;
 --rS:#e6c35c;--rA:#6fbf94;--rB:#7fb0e6;--rC:#9d9c94}}
*{box-sizing:border-box}
html{scroll-padding-top:96px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 80px}
button{font:inherit;color:var(--tx);background:var(--ac2);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
button.primary{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button:disabled{opacity:.5}
a{color:var(--ac)}
[hidden]{display:none!important}
/* sticky Leiste */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 20px}
.bar .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .back{text-decoration:none;font-size:14px;color:var(--mu);white-space:nowrap}
.dnav{display:flex;align-items:center;gap:6px}
.dnav button{padding:0 12px}
.dnav .dt{min-width:150px;text-align:center;font-weight:600}
.dnav .dt small{display:block;font-weight:400;color:var(--mu);font-size:12px}
.sp{flex:1}
.net{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.net.pos{color:var(--ac)}.net.neg{color:var(--bad)}
.rank{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff}
.rank.S{background:var(--rS)}.rank.A{background:var(--rA)}.rank.B{background:var(--rB)}.rank.C{background:var(--rC)}
.ringw{position:relative;width:46px;height:46px}
.ringw svg{width:46px;height:46px;transform:rotate(-90deg)}
.ringw b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.save{font-size:12px;color:var(--mu);min-width:70px;text-align:right}
.save.err{color:var(--bad)}
/* Hero */
.hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px}
.card h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.mu{color:var(--mu);font-size:13.5px}
.bar2{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar2 i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s}
.info{margin:0 0 12px;padding:12px 14px;border-radius:12px;background:var(--ac2);border:1px solid var(--bd);font-size:14px}
.info.warn{background:var(--bad2);color:var(--bad)}
.puz{display:flex;justify-content:space-between;align-items:center;gap:10px}
/* Werkzeugleiste */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.tools input[type=search]{flex:1;min-width:180px;font:inherit;padding:10px 12px;min-height:44px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
.tools label{display:flex;align-items:center;gap:6px;font-size:14px;min-height:44px}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.cats a{font-size:13px;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:7px 12px;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.cats a em{font-style:normal;color:var(--mu);font-size:12px}
.cats a.has{border-color:var(--ac)}
/* Raster */
section.cat{margin:22px 0 0}
section.cat>h2{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
section.cat>h2 small{color:var(--mu);font-weight:400;font-size:13px}
.grp{border:1px dashed var(--bd);border-radius:14px;padding:8px;margin:0 0 8px}
.grp>.gl{font-size:12px;color:var(--mu);margin:0 4px 6px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:8px}
.chip{position:relative;display:flex;gap:8px;align-items:flex-start;text-align:left;width:100%;min-height:56px;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;color:var(--tx);cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.chip .t{flex:1;font-size:14.5px;line-height:1.3}
.chip .t small{display:block;color:var(--mu);font-size:11.5px;margin-top:3px}
.chip .p{font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ac)}
.chip.neg .p{color:var(--bad)}.chip.zero .p{color:var(--mu)}
.chip.on{background:var(--ac2);border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.chip.neg.on{background:var(--bad2);border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.chip.dead{opacity:.5;cursor:default}
.chip.note{cursor:default;background:transparent;border-style:dashed;margin:0;padding:10px 12px}
.chip .cnt{position:absolute;right:8px;bottom:6px;display:flex;align-items:center;gap:6px}
.chip .cnt b{font-size:13px;background:var(--ac);color:#fff;border-radius:99px;padding:1px 8px}
.chip.neg .cnt b{background:var(--bad)}
.chip .cnt .minus{min-height:30px;min-width:30px;padding:0;border-radius:99px;line-height:1}
.chip.hasmax{padding-bottom:30px}
.chip .z{position:absolute;top:-7px;right:10px;font-size:10.5px;background:var(--bd);color:var(--mu);border-radius:99px;padding:1px 7px}
.chip.zeroed .p{text-decoration:line-through}
.empty{color:var(--mu);padding:20px 0}
.chip.auto{cursor:default;border-style:dashed}
.chip .st{display:block;font-weight:600;font-size:13px;color:var(--ac);margin-top:2px}
.chip.neg .st{color:var(--bad)}
.wh ul{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.wh li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:14px}
.wh li small{display:block;color:var(--mu);font-size:11.5px}
.wh li b{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ac)}.wh li b.neg{color:var(--bad)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:4px;font-size:14px}
.facts span b{font-variant-numeric:tabular-nums}
.pend{background:var(--bad2);color:var(--bad)}
input[type=time]{font:inherit;padding:8px 10px;min-height:44px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
/* Abschluss / Einstellungen */
textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
/* Overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
.ov .box{background:var(--card);border-radius:20px;padding:26px 30px;text-align:center;max-width:420px;width:100%}
.lvlup .n{font-size:96px;font-weight:800;color:var(--gold);line-height:1;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.lvlup .ring{width:150px;height:150px;border-radius:50%;margin:0 auto 10px;border:6px solid var(--gold);display:grid;place-items:center;animation:ring 1.6s ease-out both}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--gold)}100%{box-shadow:0 0 0 60px transparent}}
@media (prefers-reduced-motion:reduce){.lvlup .n,.lvlup .ring{animation:none}.bar2 i{transition:none}}
.sum ul{list-style:none;padding:0;margin:10px 0;text-align:left;font-size:14px}
.sum li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid var(--bd)}
@media (max-width:900px){.wh ul{grid-template-columns:1fr}.hero{grid-template-columns:1fr 1fr}.hero .card:first-child{grid-column:1/-1}.dnav .dt{min-width:120px}.bar .back{display:none}}
</style></head><body>
<div class="bar"><div class="in">
  <a class="back" href="index.html">← Start</a>
  <div class="dnav"><button id="prev" aria-label="Vortag">‹</button><div class="dt" id="dt">–</div><button id="next" aria-label="Folgetag">›</button></div>
  <div class="sp"></div>
  <div class="net" id="netTop">0</div>
  <div class="rank C" id="rankTop">C</div>
  <div class="ringw" id="ringTop"></div>
  <div class="save" id="save"></div>
</div></div>
<div class="wrap">
  <div id="msg"></div>
  <div class="hero">
    <div class="card"><h3>Heute</h3><div class="big" id="hNet">0</div><div class="mu" id="hRank"></div><div class="mu" id="hMods"></div></div>
    <div class="card"><h3>Level</h3><div class="big" id="hLvl">1</div><div class="bar2"><i id="hLvlBar" style="width:0"></i></div><div class="mu" id="hLvlTxt"></div></div>
    <div class="card"><h3>Dopamin-Konto (gespeichert)</h3><div class="big" id="hAcc">0</div><div class="mu" id="hAccTxt"></div></div>
  </div>
  <div class="info" id="legacy" hidden></div>
  <div class="info" id="yFocus" hidden></div>
  <section class="cat" id="whoop"><h2>Automatisch von Whoop <small id="whState"></small></h2>
    <div class="card wh"><div class="facts" id="facts"></div><ul id="whList"></ul><div class="mu" id="whNote" style="margin-top:8px"></div>
      <div class="row"><button id="whRefresh">Whoop jetzt aktualisieren</button></div></div></section>
  <div class="card puz" id="puzCard" style="margin:12px 0"></div>
  <div id="grid"></div>

  <section class="cat" id="abschluss">
    <h2>Tagesabschluss <small>Fokus für morgen, dann Tag abschließen</small></h2>
    <div class="card">
      <textarea id="focus" placeholder="Worauf konzentrierst du dich morgen?" aria-label="Fokus für morgen"></textarea>
      <div class="row"><button class="primary" id="closeBtn">Tag abschließen</button><span class="mu" id="closeInfo"></span></div>
    </div>
  </section>

  <section class="cat" id="settings">
    <h2>Einstellungen</h2>
    <div class="card">
      <div class="mu" id="setInfo"></div>
      <div class="row"><label for="bt">Zielzeit Einschlafen (Mo–Fr):</label><input type="time" id="bt"><span class="mu">Ohne Zielzeit zählen die Wochentags-Bettzeit-Punkte nicht.</span></div>
      <div class="row"><button id="exportBtn">Alles als JSON exportieren</button><span class="mu" id="exportInfo"></span></div>
    </div>
  </section>
</div>
<div class="ov" id="ov" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="fb.js"></script>
<script src="engine.js"></script>
<script src="puzzle-dop.js"></script>
<script src="whoop-auto.js"></script>
<script>
(async function(){
const E=window.LBEngine, PD=window.PuzzleDop, WA=window.WhoopAuto;
const WORKER='https://life-board-whoop.momo-haskamp.workers.dev';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=E.fmt;
const CURV=2;
const RULES={};
let user,base,today,cur;
let DAYS={},PUZ={},SETTINGS={},WH={},WHSTATE='loading',WHMSG='';
let ackTimer=null;
const LSKEY='lb_pending_days';

function showMsg(html,warn){ $('msg').innerHTML=html?'<div class="info'+(warn?' warn':'')+'">'+html+'</div>':'' }
function setSave(t,err){const s=$('save');s.textContent=t;s.className='save'+(err?' err':'')}
async function rulesFor(v){
  if(RULES[v])return RULES[v];
  const r=await fetch('rules/v'+v+'.json?c='+v,{cache:'no-cache'});
  if(!r.ok)throw new Error('Regelwerk v'+v+' nicht ladbar ('+r.status+')');
  return RULES[v]=await r.json();
}
async function wfetch(path,opts){
  const t=await user.getIdToken();
  const r=await fetch(WORKER+path,Object.assign({headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'}},opts||{}));
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error((d&&d.error)||('Fehler '+r.status));
  return d;
}

/* ---------- Rechnen ---------- */
const dayOf=k=>DAYS[k]||null;
const versionOf=k=>(DAYS[k]&&DAYS[k].rulesVersion)||CURV;
function puzFor(k){
  const d=DAYS[k];
  if(d&&d.closed&&d.puz!==undefined)return d.puz;
  return PUZ[k]===undefined?null:PUZ[k];
}
function blockedFor(k,rules){
  const b={};
  for(const a of rules.actions){
    if(!a.period)continue;
    const pk=E.periodKey(a.period,k);
    for(const d of Object.keys(DAYS)){
      if(d===k)continue;
      const dc=DAYS[d].a||{};
      if(E.periodKey(a.period,d)===pk&&(dc[a.id]|0)>0){b[a.id]=d;break}
    }
  }
  return b;
}
function sportInput(rules,inp){return rules.ui.buttons.some(b=>b.group==='sport'&&(inp[b.id]|0)>0)}
/* Alles zu einem Tag: Eingaben + Whoop-Automatik -> Aktionen -> Punkte */
function calc(k){
  const d=DAYS[k]||{};const v=versionOf(k);const rules=RULES[v]||RULES[CURV];
  if(v<2){ // altes Regelwerk: nur Anzeige
    const res=E.computeDay(rules,d.a||{},{puz:puzFor(k),blocked:{}});
    return{rules,res,counts:d.a||{},auto:{},why:{},whoopHas:{},legacy:true,blocked:{},row:null,have:{}};
  }
  const inp=d.in||{};
  const whoopHas={};
  if(WH&&Object.keys(WH).length){const wm=WA.workoutMinutes(WH,k);rules.ui.buttons.forEach(b=>{if(b.whoop&&wm[b.whoop]>=b.tiers[0].min)whoopHas[b.whoop]=wm[b.whoop]})}
  const manual=E.deriveCounts(rules,inp,Object.fromEntries(rules.ui.buttons.filter(b=>b.whoop&&whoopHas[b.whoop]).map(b=>[b.id,true])));
  let auto,why={},row=null,have={};
  if(d.closed&&d.auto){auto=d.auto}
  else{
    const prev=DAYS[E.addDays(k,-1)];
    const a=WA.autoDay(WH,k,{final:k<today,target:SETTINGS.bedtimeTarget||null,prevAlcohol:!!(prev&&prev.in&&(prev.in.alkohol|0)>0),manualSport:sportInput(rules,inp)});
    auto=a.counts;why=a.why;row=a.row;have=a.have;
  }
  
  if(d.closed&&d.auto&&d.autoWhy)why=d.autoWhy;
  let counts=E.mergeCounts(manual,auto);counts=E.mergeCounts(counts,d.x||{});
  const blocked=blockedFor(k,rules);
  const res=E.computeDay(rules,counts,{puz:puzFor(k),blocked});
  return{rules,res,counts,auto,why,whoopHas,legacy:false,blocked,row,have,inp};
}
/* Konto: abgeschlossene Tage mit ihrem gespeicherten Wert, alle anderen live aus Whoop + Eingaben */
function netOf(k){
  const d=DAYS[k];if(!d)return 0;
  if(d.closed||versionOf(k)<2||WHSTATE!=='ok')return d.net||0;
  return calc(k).res.net;
}
function priorAccount(k){let s=0;for(const d of Object.keys(DAYS)){if(d!==k)s+=netOf(d)}return s}
function levelOf(k){const c=calc(k);return E.levelInfo(c.rules,priorAccount(k)+c.res.net).level}

/* ---------- Speichern ---------- */
function lsGet(){try{return JSON.parse(localStorage.getItem(LSKEY+'_'+user.uid)||'{}')}catch(e){return{}}}
function lsSet(o){try{localStorage.setItem(LSKEY+'_'+user.uid,JSON.stringify(o))}catch(e){}}
function buildDoc(k,over){
  const old=DAYS[k]||{};
  const doc=Object.assign({},old,over||{});
  doc.date=k;doc.rulesVersion=(over&&over.rulesVersion)||old.rulesVersion||CURV;
  doc.in=doc.in||{};
  DAYS[k]=doc;doc.puz=puzFor(k);const c2=calc(k);
  doc.a=c2.counts;doc.net=c2.res.net;doc.rank=c2.res.rank;
  doc.closed=!!doc.closed;doc.focus=doc.focus||'';doc.updatedAt=Date.now();
  if(!doc.closed){delete doc.auto;delete doc.autoWhy}
  return doc;
}
function persist(over){
  const doc=buildDoc(cur,over);
  DAYS[cur]=doc;
  const p=lsGet();p[cur]=doc;lsSet(p);              // lokale Sicherung, bis Firestore bestätigt hat
  flush(cur);
}
async function flush(k){
  const doc=DAYS[k];if(!doc)return;
  setSave('speichert …');
  clearTimeout(ackTimer);ackTimer=setTimeout(()=>setSave('nicht bestätigt – offline?',true),6000);
  try{
    await fs.doc(base+'/days/'+k).set(doc);
    clearTimeout(ackTimer);
    if(DAYS[k]===doc||DAYS[k].updatedAt===doc.updatedAt){const p=lsGet();if(p[k]&&p[k].updatedAt<=doc.updatedAt){delete p[k];lsSet(p)}}
    setSave('gespeichert ✓ '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
    showMsg('');writeState();
  }catch(e){
    clearTimeout(ackTimer);setSave('NICHT gespeichert',true);
    if(e&&e.code==='permission-denied')showMsg('<b>Nicht gespeichert:</b> Firestore verweigert das Schreiben nach <code>users/'+esc(user.uid)+'/days</code>. Deine Eingaben sind lokal gesichert. In Firebase unter Firestore → Regeln muss stehen: <code>match /users/{uid}/{document=**} { allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid; }</code>',true);
    else showMsg('<b>Nicht gespeichert:</b> '+esc(e.message||e)+' – deine Eingaben sind lokal gesichert und werden beim nächsten Öffnen erneut gesendet.',true);
  }
}
function writeState(){
  try{
    const acc=Object.keys(DAYS).reduce((s,d)=>s+netOf(d),0);
    const li=E.levelInfo(RULES[CURV],acc);
    fs.doc(base+'/state/current').set({account:acc,level:li.level,days:Object.keys(DAYS).length,rulesVersion:CURV,updatedAt:Date.now()}).catch(()=>{});
  }catch(e){}
}

/* ---------- Tippen ---------- */
function tap(bid,minus){
  const c=calc(cur);if(c.legacy)return;
  const b=c.rules.ui.buttons.find(x=>x.id===bid);if(!b)return;
  if(c.whoopHas[b.whoop])return;                           // Whoop liefert diesen Wert
  if(DAYS[cur]&&DAYS[cur].closed)return;
  const before=levelOf(cur);
  const inp=Object.assign({},(DAYS[cur]&&DAYS[cur].in)||{});
  const v=inp[bid]|0;
  let nv;
  if(minus)nv=Math.max(0,v-1);
  else{const act=c.rules.actions.find(a=>a.id===(b.ids||[])[0]);nv=E.nextValue(b,v,act&&act.max)}
  if(nv===v&&!minus)return;
  if(nv)inp[bid]=nv;else delete inp[bid];
  persist({in:inp});render();
  const after=levelOf(cur);
  if(after>before)levelUp(after);
}

/* ---------- Anzeige ---------- */
function ring(frac,lvl){
  const r=19,c=2*Math.PI*r;
  return '<svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="'+r+'" fill="none" stroke="var(--bd)" stroke-width="5"/><circle cx="23" cy="23" r="'+r+'" fill="none" stroke="var(--ac)" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(c*frac).toFixed(1)+' '+c.toFixed(1)+'"/></svg><b>'+lvl+'</b>';
}
function dateLabel(k){
  const [y,m,d]=k.split('-').map(Number);
  const wd=new Intl.DateTimeFormat('de-DE',{weekday:'short',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,d)));
  return wd+', '+String(d).padStart(2,'0')+'.'+String(m).padStart(2,'0')+'.';
}
function renderSummary(c){
  const {rules,res}=c;
  const prior=priorAccount(cur),acc=prior+res.net;
  const li=E.levelInfo(rules,acc),rp=E.rankProgress(rules,res.net);
  $('dt').innerHTML=dateLabel(cur)+'<small>'+(cur===today?'heute':cur)+'</small>';
  $('next').disabled=cur>=today;
  const cls=res.net>0?'pos':res.net<0?'neg':'';
  $('netTop').textContent=fmt(res.net,true);$('netTop').className='net '+cls;
  $('rankTop').textContent=res.rank;$('rankTop').className='rank '+res.rank;
  $('ringTop').innerHTML=ring(li.frac,li.level);
  $('hNet').textContent=fmt(res.net,true);$('hNet').className='big '+cls;
  $('hRank').textContent='Rang '+res.rank+(rp.next?' · noch '+fmt(rp.toNext)+' bis '+rp.next:' · höchster Rang');
  $('hMods').textContent=res.modInfo&&res.modInfo.factor!==1?'Sport ×'+String(res.modInfo.factor.toFixed(2)).replace('.',',')+' ('+fmt(res.modDelta,true)+')':'';
  $('hLvl').textContent='Level '+li.level;
  $('hLvlBar').style.width=(li.frac*100).toFixed(1)+'%';
  $('hLvlTxt').textContent=li.max?'Höchstes Level erreicht':fmt(li.into)+' / '+fmt(li.need)+' · noch '+fmt(li.toNext)+' bis Level '+(li.level+1);
  $('hAcc').textContent=fmt(acc);
  $('hAccTxt').textContent='davor '+fmt(prior)+' · heute '+fmt(res.net,true)+' · '+Object.keys(DAYS).length+' Tage';
  const p=puzFor(cur);
  $('puzCard').innerHTML='<div><b>🧩 Puzzle-Tracker (PUZ-01)</b><div class="mu">'+(p==null?'Für diesen Tag steht noch kein Puzzle im Tracker.':'Tageswert aus dem Tracker, 1:1 übernommen'+(DAYS[cur]&&DAYS[cur].closed?' (eingefroren)':''))+'</div></div><div style="display:flex;align-items:center;gap:12px"><span class="big" style="font-size:24px">'+(p==null?'–':fmt(p,true))+'</span><a href="puzzle.html" class="mu">öffnen</a></div>';
  const yf=(DAYS[E.addDays(cur,-1)]||{}).focus;
  $('yFocus').hidden=!yf;if(yf)$('yFocus').innerHTML='<b>Fokus von gestern Abend:</b> '+esc(yf);
  const d=DAYS[cur]||{};
  if(document.activeElement!==$('focus'))$('focus').value=d.focus||'';
  $('closeBtn').textContent=d.closed?'Wieder öffnen':'Tag abschließen';
  $('closeInfo').textContent=d.closed?'Tag abgeschlossen'+(d.closedAt?' um '+new Date(d.closedAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):''):'Setzt „Tagesabschluss ausgefüllt“ (+ „Fokus gesetzt“) und rechnet alle Strain- und Schritt-Punkte ein.';
  $('legacy').hidden=!c.legacy;
  if(c.legacy)$('legacy').innerHTML='Dieser Tag wurde mit Regelwerk v1 erfasst und wird nur angezeigt. <button id="toV2">Mit v2 neu erfassen</button>';
}
const BASE_ACT=(rules,id)=>rules.actions.find(a=>a.id===id);
function sumPts(c,ids){return ids.reduce((s,id)=>{const l=c.res.lines.find(x=>x.id===id);return s+(l?l.pts:0)},0)}
function rawPts(rules,ids){return ids.reduce((s,id)=>s+((BASE_ACT(rules,id)||{}).points||0),0)}
function chipHtml(b,c){
  const v=(c.inp&&c.inp[b.id])|0;
  const wm=c.whoopHas[b.whoop];
  const dis=(DAYS[cur]&&DAYS[cur].closed)||c.legacy;
  let on=v>0,state='',hint='',ids=[];
  if(wm){on=true;ids=E.buttonIds(b,wm);state='Whoop: '+wm+' Min';}
  else if(on){
    ids=E.buttonIds(b,v);
    state=b.kind==='amount'?v+' '+b.unit:b.kind==='choice'?b.options[v-1].label:b.kind==='count'?v+' / '+((BASE_ACT(c.rules,b.ids[0])||{}).max||1):'';
  }
  if(!on){
    if(b.kind==='amount')hint=b.presets.join(' · ')+' '+b.unit;
    else if(b.kind==='choice')hint=b.options.map(o=>o.label).join(' · ');
  }
  const pts=on?sumPts(c,ids):rawPts(c.rules,E.buttonIds(b,b.kind==='amount'?b.presets[0]:1));
  const cls=['chip',pts<0?'neg':'',on?'on':'',wm?'auto':'',dis&&!wm?'dead':''].filter(Boolean).join(' ');
  const p=on?fmt(pts,true):(b.kind==='amount'?'ab '+fmt(pts,true):b.kind==='choice'?'':fmt(pts,true));
  let cnt='';
  if(b.kind==='count'&&on&&!dis)cnt='<span class="cnt"><button class="minus" data-minus="'+b.id+'" aria-label="eins weniger">−</button></span>';
  return '<div class="'+cls+(b.kind==='count'?' hasmax':'')+'" role="button" tabindex="0" data-b="'+b.id+'" aria-pressed="'+on+'"><span class="t">'+esc(b.label)+(state?'<span class="st">'+esc(state)+'</span>':'')+(hint?'<small>'+esc(hint)+'</small>':'')+'</span><span class="p">'+p+'</span>'+cnt+'</div>';
}
function renderWhoop(c){
  const el=$('whList');
  const st={ok:'verbunden',loading:'lädt …',err:'nicht erreichbar'}[WHSTATE];
  $('whState').textContent=st;
  if(c.legacy){$('facts').innerHTML='';el.innerHTML='';$('whNote').textContent='';return}
  const r=c.row,f=[];
  if(r){
    if(r.rec!=null)f.push('Recovery <b>'+Math.round(r.rec)+' %</b>');
    if(r.hrv!=null)f.push('HRV <b>'+Math.round(r.hrv)+'</b>');
    if(r.rhr!=null)f.push('Ruhepuls <b>'+Math.round(r.rhr)+'</b>');
    if(r.asleep!=null)f.push('Schlaf <b>'+Math.floor(r.asleep/60)+':'+String(Math.round(r.asleep%60)).padStart(2,'0')+' h</b>'+(r.perf!=null?' ('+Math.round(r.perf)+' %)':''));
    if(r.strain!=null)f.push('Strain <b>'+r.strain.toFixed(1)+'</b>'+((cur>=today&&!(DAYS[cur]&&DAYS[cur].closed))?' (läuft)':''));
    if(r.steps!=null)f.push('Schritte <b>'+Math.round(r.steps)+'</b>');
    if(r.workouts.length)f.push('Workouts <b>'+r.workouts.map(w=>esc(w.sport)+' '+Math.round(w.min)+' Min').join(', ')+'</b>');
  }
  $('facts').innerHTML=f.join('');
  const act=Object.fromEntries(c.rules.actions.map(a=>[a.id,a]));
  const lines=c.res.lines.filter(l=>c.auto[l.id]&&(l.pts!==0||c.rules.whoopAuto.ids.includes(l.id)&&act[l.id].kind==='modifier'));
  el.innerHTML=lines.map(l=>{const a=act[l.id];return '<li><span>'+esc(a.text)+'<small>'+esc((c.why[l.id]||'')+(l.note?' · '+l.note:''))+' · '+l.id+'</small></span><b class="'+(l.pts<0?'neg':'')+'">'+(a.kind==='modifier'?'× '+String(a.mod.factor).replace('.',','):fmt(l.pts,true))+'</b></li>'}).join('');
  let note='';
  if(WHSTATE==='err')note='Whoop ist gerade nicht erreichbar ('+esc(WHMSG)+'). Die Whoop-Punkte fehlen vorübergehend und werden nachgerechnet, sobald die Daten da sind.';
  else if(WHSTATE==='ok'&&!(r&&(r.rec!=null||r.asleep!=null)))note='Für diesen Tag liefert Whoop noch keine Schlaf- oder Recovery-Daten. „Jetzt aktualisieren“ holt sie sofort.';
  else if(cur>=today&&!(DAYS[cur]&&DAYS[cur].closed))note='Strain- und Schritt-Punkte kommen dazu, sobald du den Tag abschließt oder er vorbei ist.';
  if(!SETTINGS.bedtimeTarget&&cur&&new Date(cur+'T12:00:00Z').getUTCDay()%6!==0)note+=(note?' ':'')+'Zielzeit für Mo–Fr fehlt (Einstellungen), deshalb zählt die Bettzeit unter der Woche noch nicht.';
  $('whNote').textContent=note;
}
function render(){
  const c=calc(cur);
  renderSummary(c);renderWhoop(c);
  let html='';
  for(const g of RULES[CURV].ui.groups){
    const bs=RULES[CURV].ui.buttons.filter(b=>b.group===g.id);
    html+='<section class="cat" id="g-'+g.id+'"><h2>'+esc(g.name)+'<small>'+bs.length+' Knöpfe</small></h2><div class="chips">'+bs.map(b=>chipHtml(b,c)).join('')+'</div></section>';
  }
  $('grid').innerHTML=html;
}

/* ---------- Overlays ---------- */
function overlay(html,ms){
  const o=$('ov');o.innerHTML='<div class="box">'+html+'</div>';o.hidden=false;
  const close=()=>{o.hidden=true;clearTimeout(t)};
  const t=ms?setTimeout(close,ms):null;
  o.onclick=e=>{if(e.target.id==='ov'||!ms||true)close()};
}
function levelUp(lv){overlay('<div class="lvlup"><div class="ring"><div class="n">'+lv+'</div></div><h2 style="margin:6px 0 2px">Level '+lv+'!</h2><div class="mu">Aufgestiegen. Tippen zum Schließen.</div></div>',3000)}

async function closeDay(){
  const d=DAYS[cur]||{};
  if(d.closed){persist({closed:false,closedAt:null,x:{}});delete DAYS[cur].closedAt;render();return}
  const before=levelOf(cur);
  const focus=$('focus').value.trim();
  const a=WA.autoDay(WH,cur,{final:true,target:SETTINGS.bedtimeTarget||null,prevAlcohol:!!((DAYS[E.addDays(cur,-1)]||{}).in&&(DAYS[E.addDays(cur,-1)].in.alkohol|0)>0),manualSport:sportInput(RULES[CURV],d.in||{})});
  const x={'ABD-01':1};if(focus)x['ABD-02']=1;
  persist({focus,x,closed:true,closedAt:Date.now(),auto:a.counts,autoWhy:a.why,puz:PUZ[cur]===undefined?null:PUZ[cur]});
  render();
  const c=calc(cur),acc=priorAccount(cur)+c.res.net,li=E.levelInfo(c.rules,acc);
  const act=Object.fromEntries(c.rules.actions.map(a=>[a.id,a]));
  const lines=c.res.lines.filter(l=>l.pts!==0).sort((a,b)=>Math.abs(b.pts)-Math.abs(a.pts)).slice(0,6);
  overlay('<div class="sum"><div class="rank '+c.res.rank+'" style="margin:0 auto 8px;width:64px;height:64px;font-size:34px">'+c.res.rank+'</div><div class="big">'+fmt(c.res.net,true)+'</div><div class="mu">Level '+li.level+' · Konto '+fmt(acc)+'</div><ul>'+lines.map(l=>'<li><span>'+esc(act[l.id].text)+(l.count>1?' ×'+l.count:'')+'</span><b>'+fmt(l.pts,true)+'</b></li>').join('')+'</ul><button class="primary" id="ovOk">Fertig</button></div>');
  if(li.level>before)setTimeout(()=>levelUp(li.level),150);
}

/* ---------- Whoop laden ---------- */
async function loadWhoop(){
  WHSTATE='loading';
  try{
    const d=await wfetch('/data?from='+E.addDays(today,-365)+'&to='+today);
    WH=d.days||{};WHSTATE='ok';WHMSG='';
  }catch(e){WHSTATE='err';WHMSG=e.message||String(e)}
}
async function refreshWhoop(){
  $('whRefresh').disabled=true;$('whState').textContent='aktualisiert …';
  try{await wfetch('/sync',{method:'POST',body:JSON.stringify({days:3})})}catch(e){WHMSG=e.message}
  await loadWhoop();
  $('whRefresh').disabled=false;
  const c=calc(cur);
  if(WHSTATE==='ok'&&DAYS[cur]&&!DAYS[cur].closed&&c.res.net!==DAYS[cur].net)persist();
  render();
}

/* ---------- Export & Einstellungen ---------- */
async function doExport(){
  try{
    const snap=await fs.collection(base+'/days').get();
    const days={};snap.docs.forEach(x=>{days[x.id]=x.data()});
    const settings=(await fs.doc(base+'/settings/main').get()).data()||{};
    const versions=[...new Set(Object.values(days).map(d=>d.rulesVersion||1).concat([CURV]))];
    const rules={};for(const v of versions)rules[v]=await rulesFor(v);
    const out={v:2,app:'life-board-heute',exported:new Date().toISOString(),days,settings,rules};
    const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download='life-board-heute-'+today+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
    SETTINGS.lastExport=Date.now();await fs.doc(base+'/settings/main').set({lastExport:SETTINGS.lastExport},{merge:true});
    setInfo();$('exportInfo').textContent=Object.keys(days).length+' Tage exportiert';
  }catch(e){$('exportInfo').textContent='Export fehlgeschlagen: '+(e.message||e)}
}
function setInfo(){
  const r=RULES[CURV];
  let t='Regelwerk v'+CURV+' · '+r.ui.buttons.length+' Knöpfe + '+r.whoopAuto.ids.length+' Whoop-Regeln · Tageswechsel '+String(r.day.changeHour).padStart(2,'0')+':00 '+r.day.timezone+'.';
  if(SETTINGS.lastExport){const d=Math.floor((Date.now()-SETTINGS.lastExport)/864e5);t+=' Letzter Export vor '+d+(d===1?' Tag':' Tagen')+'.'}
  else t+=' Noch nie exportiert.';
  $('setInfo').textContent=t;
  $('bt').value=SETTINGS.bedtimeTarget||'';
}

/* ---------- Events ---------- */
$('grid').addEventListener('click',e=>{
  const m=e.target.closest('[data-minus]');if(m){e.stopPropagation();tap(m.dataset.minus,true);return}
  const c=e.target.closest('.chip[data-b]');if(c)tap(c.dataset.b);
});
$('grid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.chip[data-b]')){e.preventDefault();tap(e.target.dataset.b)}});
$('focus').addEventListener('input',()=>{if(DAYS[cur]&&DAYS[cur].closed)return;persist({focus:$('focus').value});renderSummary(calc(cur))});
$('closeBtn').addEventListener('click',closeDay);
$('exportBtn').addEventListener('click',doExport);
$('whRefresh').addEventListener('click',refreshWhoop);
$('bt').addEventListener('change',async()=>{
  SETTINGS.bedtimeTarget=$('bt').value||null;
  try{await fs.doc(base+'/settings/main').set({bedtimeTarget:SETTINGS.bedtimeTarget},{merge:true})}catch(e){showMsg('Zielzeit nicht gespeichert: '+esc(e.message||e),true)}
  if(DAYS[cur]&&!DAYS[cur].closed)persist();render();
});
document.addEventListener('click',e=>{
  if(e.target.id==='ovOk')$('ov').hidden=true;
  if(e.target.id==='toV2'){const d=DAYS[cur];persist({rulesVersion:2,in:{},a:{},x:{},closed:false});render()}
});
async function go(k){
  cur=k;const v=versionOf(k);
  try{await rulesFor(v)}catch(e){showMsg(esc(e.message),true)}
  render();window.scrollTo(0,0);
}
$('prev').addEventListener('click',()=>go(E.addDays(cur,-1)));
$('next').addEventListener('click',()=>{if(cur<today)go(E.addDays(cur,1))});

/* ---------- Start ---------- */
try{
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  user=await requireUser();base='users/'+user.uid;
  await rulesFor(CURV);
  const r=RULES[CURV];
  today=E.dayKey(new Date(),r.day.timezone,r.day.changeHour);cur=today;
  const [ps,ds,ss]=await Promise.all([fs.collection(base+'/puzzle').get(),fs.collection(base+'/days').get(),fs.doc(base+'/settings/main').get()]);
  const D={};ps.docs.forEach(x=>{if(/^\d{4}-\d\d-\d\d$/.test(x.id)){const v=x.data()||{};if(v.g)D[x.id]=v.g}});
  PUZ=PD.puzzleDayValues(D);
  ds.docs.forEach(x=>{if(/^\d{4}-\d\d-\d\d$/.test(x.id))DAYS[x.id]=x.data()});
  SETTINGS=ss.exists?ss.data():{};
  for(const v of new Set(Object.values(DAYS).map(d=>d.rulesVersion||1)))await rulesFor(v);
  // lokal gesicherte, noch nicht bestätigte Tage erneut senden
  const pend=lsGet();let replay=[];
  for(const k of Object.keys(pend)){if(!DAYS[k]||(DAYS[k].updatedAt||0)<=(pend[k].updatedAt||0)){DAYS[k]=pend[k];replay.push(k)}}
  // offene Tage aus Regelwerk v1 auf v2 umstellen (alte Angaben bleiben als legacyV1 erhalten)
  for(const k of Object.keys(DAYS)){const d=DAYS[k];if((d.rulesVersion||1)<2&&!d.closed){
    DAYS[k]=Object.assign({},d,{rulesVersion:2,in:{},a:{},x:{},legacyV1:{a:d.a||{},net:d.net||0},updatedAt:Date.now()});
    const p=lsGet();p[k]=DAYS[k];lsSet(p);replay.push(k)}}
  setInfo();render();setSave('');
  replay.forEach(k=>flush(k));
  await loadWhoop();
  const c=calc(cur);
  if(WHSTATE==='ok'&&DAYS[cur]&&!DAYS[cur].closed&&versionOf(cur)>=2&&c.res.net!==DAYS[cur].net)persist();
  render();writeState();
}catch(e){
  if(e&&e.code==='permission-denied')showMsg('Firestore verweigert den Zugriff. Die Regeln müssen alle Unterordner von <code>users/{uid}</code> erlauben.',true);
  else showMsg('Laden fehlgeschlagen: '+esc(e.message||e),true);
}
})();
</script>
</body></html>
