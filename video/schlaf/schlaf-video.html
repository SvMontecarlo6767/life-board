<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ohne Schlaf?</title>
<style>
  :root { --bg:#040b1c; --gold:#f2c14e; --teal:#3fd0c9; --ink:#eef3ff; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { width:min(100vw, calc(100vh * 16 / 9)); height:auto; aspect-ratio:16/9; display:block; background:#06122a; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; gap:18px; align-items:center; justify-content:center;
    background:rgba(4,11,28,.72); }
  #overlay h1 { font-size:clamp(22px,4vw,44px); margin:0 16px; text-align:center; font-weight:800; }
  #overlay p { margin:0 16px; opacity:.75; text-align:center; font-size:clamp(14px,2vw,18px); }
  button { font:inherit; font-weight:700; font-size:20px; padding:14px 34px; border-radius:999px; border:0; cursor:pointer;
    background:var(--gold); color:#1a1300; box-shadow:0 0 30px rgba(242,193,78,.45); }
  #bar { position:fixed; left:0; bottom:0; height:4px; background:var(--teal); width:0; }
  body.export #overlay, body.export #bar { display:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="overlay">
  <h1>Was wäre, wenn wir keinen Schlaf bräuchten?</h1>
  <p>Erklärvideo · ca. 60 Sekunden · mit Untertiteln</p>
  <button id="play">▶ Start</button>
</div>
<div id="bar"></div>
<script>
"use strict";
const W = 1920, H = 1080, FPS = 30;
const C = { gold:"#f2c14e", goldSoft:"rgba(242,193,78,", teal:"#3fd0c9", tealSoft:"rgba(63,208,201,", ink:"#eef3ff",
            mute:"#9fb0cf", red:"#ff7a6b", night:"#0b1d3d" };
const FONT = 'Inter, "Segoe UI", Roboto, Arial, sans-serif';
const cv = document.getElementById("c"), ctx = cv.getContext("2d");

/* ---------- helpers ---------- */
const clamp = (v,a=0,b=1) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const prog = (t,a,b) => clamp((t-a)/(b-a));
const eOut = t => 1 - Math.pow(1-t, 3);
const eInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const eBack = t => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
const de = (n, d=0) => { // German number format
  const s = n.toFixed(d).split("."); s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return s.join(","); };
function rng(seed){ return () => (seed = (seed*16807) % 2147483647) / 2147483647; }

function txt(s, x, y, size, color=C.ink, opt={}) {
  ctx.save();
  ctx.globalAlpha *= (opt.alpha ?? 1);
  ctx.font = `${opt.weight ?? 700} ${size}px ${FONT}`;
  ctx.textAlign = opt.align ?? "center"; ctx.textBaseline = opt.base ?? "alphabetic";
  if (opt.glow) { ctx.shadowColor = opt.glow; ctx.shadowBlur = opt.blur ?? 30; }
  if (opt.track) ctx.letterSpacing = opt.track + "px";
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  ctx.restore();
}
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function tag(label, x, y, color=C.teal, alpha=1) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.font = `800 30px ${FONT}`; ctx.letterSpacing = "5px";
  const w = ctx.measureText(label).width + 52;
  rrect(x - w/2, y - 34, w, 54, 27); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = color; ctx.textAlign = "center"; ctx.fillText(label, x + 2, y + 3);
  ctx.restore();
}
function dashLine(x1,y1,x2,y2,col,w=3,dash=[14,12]){ ctx.save(); ctx.setLineDash(dash); ctx.strokeStyle=col; ctx.lineWidth=w;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore(); }

/* ---------- background (always moving) ---------- */
const STARS = (() => { const r = rng(42), a = []; for (let i=0;i<170;i++) a.push({x:r()*W, y:r()*H*0.85, s:r()*2.2+.4, p:r()*6.28, v:r()*8+3}); return a; })();
function background(t, tint=0) {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, "#050d22"); g.addColorStop(.6, "#081a35"); g.addColorStop(1, "#06261f");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // drifting aurora blobs
  for (const [cx,cy,r,col,sp] of [[.25,.35,700,"rgba(63,208,201,0.10)",.11],[.8,.6,800,"rgba(26,120,90,0.14)",.08],[.55,.15,600,"rgba(242,193,78,0.05)",.13]]) {
    const x = W*cx + Math.sin(t*sp*2)*140, y = H*cy + Math.cos(t*sp*1.6)*90;
    const rg = ctx.createRadialGradient(x,y,0,x,y,r); rg.addColorStop(0,col); rg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  }
  for (const s of STARS) {
    const x = (s.x + t*s.v) % W, a = .35 + .45*Math.sin(t*1.7 + s.p);
    ctx.globalAlpha = a; ctx.fillStyle = "#dfe8ff"; ctx.beginPath(); ctx.arc(x, s.y, s.s, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (tint) { ctx.fillStyle = `rgba(0,0,0,${tint})`; ctx.fillRect(0,0,W,H); }
}

/* ---------- reusable graphics ---------- */
function hemisphere(cx, cy, rx, ry, side, glow, t, waveSpeed=1) {
  // one brain hemisphere seen from above; side = -1 (left) / +1 (right)
  ctx.save();
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 6.283);
  const g = ctx.createRadialGradient(cx - side*rx*.2, cy - ry*.3, 10, cx, cy, ry*1.1);
  g.addColorStop(0, `rgba(63,208,201,${.35+.45*glow})`); g.addColorStop(1, `rgba(20,70,90,${.25+.3*glow})`);
  ctx.fillStyle = g; ctx.shadowColor = `rgba(63,208,201,${.6*glow})`; ctx.shadowBlur = 50*glow; ctx.fill();
  ctx.shadowBlur = 0; ctx.lineWidth = 4; ctx.strokeStyle = `rgba(160,240,235,${.4+.5*glow})`; ctx.stroke();
  ctx.clip();
  ctx.strokeStyle = `rgba(220,255,250,${.18+.35*glow})`; ctx.lineWidth = 3.5;
  for (let i = -4; i <= 4; i++) {
    ctx.beginPath();
    for (let x = -rx; x <= rx; x += 6) {
      const y = cy + i*ry*.22 + Math.sin(x*.045 + i*1.3 + t*waveSpeed)*10;
      x === -rx ? ctx.moveTo(cx+x, y) : ctx.lineTo(cx+x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function brain(cx, cy, s, t, glowL=1, glowR=1) {
  hemisphere(cx - 112*s, cy, 105*s, 150*s, -1, glowL, t);
  hemisphere(cx + 112*s, cy, 105*s, 150*s, 1, glowR, t);
}
function sideBrain(cx, cy, s) { // side profile silhouette used for the amygdala scene
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(-230, 40);
  ctx.bezierCurveTo(-260, -80, -170, -190, -40, -200);
  ctx.bezierCurveTo(90, -215, 220, -150, 240, -30);
  ctx.bezierCurveTo(255, 50, 210, 110, 120, 115);
  ctx.bezierCurveTo(80, 160, 20, 170, -10, 130);
  ctx.bezierCurveTo(-80, 140, -200, 130, -230, 40);
  ctx.closePath();
  const g = ctx.createLinearGradient(0,-200,0,160); g.addColorStop(0,"rgba(63,208,201,.32)"); g.addColorStop(1,"rgba(20,70,90,.35)");
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = "rgba(160,240,235,.7)"; ctx.stroke();
  ctx.clip();
  ctx.strokeStyle = "rgba(220,255,250,.22)"; ctx.lineWidth = 4;
  for (let i=0;i<7;i++){ ctx.beginPath(); for(let x=-260;x<=260;x+=8){ const y=-170+i*45+Math.sin(x*.04+i)*12; x===-260?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke(); }
  ctx.restore();
}
function dolphin(cx, cy, s, t) {
  ctx.save(); ctx.translate(cx, cy + Math.sin(t*1.4)*10); ctx.rotate(Math.sin(t*1.4)*.04); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(-330, 8);                                    // beak tip
  ctx.quadraticCurveTo(-290, -2, -250, -10);              // beak top
  ctx.bezierCurveTo(-245, -60, -200, -80, -150, -82);     // round melon
  ctx.bezierCurveTo(-90, -90, -20, -88, 30, -78);
  ctx.quadraticCurveTo(70, -110, 120, -160);              // swept dorsal fin
  ctx.quadraticCurveTo(105, -110, 110, -66);
  ctx.bezierCurveTo(170, -55, 240, -25, 290, -5);
  ctx.lineTo(360, -55); ctx.lineTo(340, 0); ctx.lineTo(365, 50); ctx.lineTo(290, 12); // fluke
  ctx.bezierCurveTo(200, 45, 60, 70, -40, 60);
  ctx.lineTo(-80, 110); ctx.lineTo(-110, 55);             // flipper
  ctx.bezierCurveTo(-180, 50, -240, 30, -260, 18);
  ctx.quadraticCurveTo(-295, 18, -330, 8);
  ctx.closePath();
  const g = ctx.createLinearGradient(0,-150,0,110); g.addColorStop(0,"#5f8fb3"); g.addColorStop(1,"#c9dbe8");
  ctx.fillStyle = g; ctx.shadowColor = "rgba(63,208,201,.4)"; ctx.shadowBlur = 30; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#0b1d3d"; ctx.beginPath(); ctx.arc(-200, -22, 8, 0, 6.283); ctx.fill(); // eye
  ctx.strokeStyle = "rgba(11,29,61,.55)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-322, 10); ctx.quadraticCurveTo(-285, 16, -248, 6); ctx.stroke(); // mouth
  ctx.restore();
}
function bird(cx, cy, s, flap) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  const w = Math.sin(flap)*35;
  ctx.beginPath();
  ctx.moveTo(-200, -20 + w); ctx.quadraticCurveTo(-110, -60 + w*.6, -20, 0);
  ctx.lineTo(0, 10); ctx.lineTo(20, 0);
  ctx.quadraticCurveTo(110, -60 + w*.6, 200, -20 + w);
  ctx.quadraticCurveTo(110, -20 + w*.4, 20, 18);
  ctx.lineTo(10, 60); ctx.lineTo(0, 45); ctx.lineTo(-10, 60); ctx.lineTo(-20, 18);
  ctx.quadraticCurveTo(-110, -20 + w*.4, -200, -20 + w);
  ctx.closePath();
  ctx.fillStyle = "#dfe8ff"; ctx.shadowColor = "rgba(242,193,78,.5)"; ctx.shadowBlur = 25; ctx.fill();
  ctx.restore();
}
function eeg(x, y, w, amp, freq, t, col, alpha=1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.beginPath();
  for (let i=0;i<=w;i+=4){ const yy = y + Math.sin(i*freq + t*6)*amp + Math.sin(i*freq*2.3 + t*9)*amp*.25; i?ctx.lineTo(x+i,yy):ctx.moveTo(x+i,yy); }
  ctx.stroke(); ctx.restore();
}
function moon(cx, cy, r, glow) {
  ctx.save();
  ctx.shadowColor = C.gold; ctx.shadowBlur = 60*glow;
  ctx.fillStyle = C.gold; ctx.beginPath();
  // crescent = outer circle minus offset circle (two arcs joined at their intersections)
  const dx = r*.45, dy = -r*.25, d = Math.hypot(dx, dy), r2 = r*.88;
  const base = Math.atan2(dy, dx), aOut = Math.acos((r*r + d*d - r2*r2) / (2*r*d)), aIn = Math.acos((r2*r2 + d*d - r*r) / (2*r2*d));
  ctx.arc(cx, cy, r, base + aOut, base - aOut + 6.283);
  ctx.arc(cx + dx, cy + dy, r2, base + Math.PI + aIn - 6.283 + 6.283, base + Math.PI - aIn, true);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
/* icons for the "paradise" cards */
function icon(kind, x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin="round";
  if (kind === "lang") {
    rrect(-55,-45,80,60,14); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-35,15); ctx.lineTo(-45,35); ctx.lineTo(-15,15); ctx.stroke();
    rrect(-5,-15,70,55,14); ctx.fill();
    ctx.fillStyle = "#0b1d3d"; ctx.font = `800 34px ${FONT}`; ctx.textAlign="center"; ctx.fillText("Aa", 30, 25);
  } else if (kind === "music") {
    ctx.beginPath(); ctx.ellipse(-25, 30, 20, 15, -.4, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(35, 18, 20, 15, -.4, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-8, 26); ctx.lineTo(-8, -45); ctx.lineTo(52, -58); ctx.lineTo(52, 14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8, -28); ctx.lineTo(52, -41); ctx.stroke();
  } else if (kind === "travel") {
    ctx.beginPath(); ctx.arc(0,0,50,0,6.283); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,0,22,50,0,0,6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-50,0); ctx.lineTo(50,0); ctx.moveTo(-43,-25); ctx.lineTo(43,-25); ctx.moveTo(-43,25); ctx.lineTo(43,25); ctx.stroke();
  } else if (kind === "friends") {
    ctx.beginPath(); ctx.arc(-25,-22,18,0,6.283); ctx.arc(30,-22,18,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(-25,40,34,Math.PI,0); ctx.fill(); ctx.beginPath(); ctx.arc(30,40,34,Math.PI,0); ctx.fill();
  }
  ctx.restore();
}

/* ---------- scenes ---------- */
// each: [start, end, drawFn(localTime, duration)]
const SCENES = [];
const S = (a, b, fn) => SCENES.push({a, b, fn});

/* 1 HOOK 0–6 s */
S(0, 3.1, (t) => {
  const k = eOut(prog(t, .1, 2.0)), n = Math.round(25*k);
  const sc = 1 + .06*Math.sin(t*3) * prog(t, 2, 3);
  ctx.save(); ctx.translate(W/2, 610); ctx.scale(sc, sc);
  txt(String(n), 0, 0, 330, C.gold, {weight:900, glow:"rgba(242,193,78,.6)", blur:60});
  ctx.restore();
  txt("JAHRE", W/2, 740, 70, C.ink, {weight:800, track:18, alpha: prog(t,.3,.9)});
  txt("verschläfst du in deinem Leben.", W/2, 210, 64, C.mute, {weight:600, alpha: prog(t,.0,.6)});
});
S(3.1, 6.2, (t) => {
  // life bar 81 years, one third fills
  const x0 = 260, x1 = W-260, y = 470, h = 90, w = x1-x0;
  txt("Ein Leben: rund 81 Jahre", W/2, 300, 60, C.ink, {weight:700, alpha: prog(t,0,.5)});
  rrect(x0, y, w, h, 45); ctx.fillStyle = "rgba(255,255,255,.08)"; ctx.fill();
  const wake = eOut(prog(t, .2, 1.4));
  rrect(x0, y, w*wake, h, 45); ctx.fillStyle = C.teal; ctx.fill();
  const sl = eOut(prog(t, 1.0, 2.2)), sw = w*(7.5/24);
  ctx.save(); rrect(x0, y, w, h, 45); ctx.clip();
  ctx.fillStyle = "#14254a"; ctx.fillRect(x1 - sw*sl, y, sw*sl, h);
  ctx.restore();
  if (sl > .2) {
    txt("wach", x0 + (w-sw)/2, y + 62, 44, "#05201e", {weight:800, alpha: prog(t,1.2,1.6)});
    txt("Schlaf", x1 - sw/2, y + 62, 44, C.gold, {weight:800, alpha: prog(t,1.4,1.8)});
  }
  txt("81 Jahre × 7,5 h ÷ 24 h ≈ 25 Jahre", W/2, 700, 58, C.gold, {weight:700, alpha: prog(t,1.6,2.2)});
});

/* 2 PARADISE 6–16 s */
S(6.2, 11.1, (t) => {
  tag("DAS PARADIES", W/2, 140, C.gold, prog(t,0,.4));
  const cx = 640, cy = 560, R = 270;
  // dial
  ctx.save(); ctx.translate(cx, cy);
  ctx.beginPath(); ctx.arc(0,0,R,0,6.283); ctx.fillStyle = "rgba(255,255,255,.05)"; ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.stroke();
  // night sector: 23:00 → 06:30 on a 24 h dial (0 h at top)
  const a0 = -Math.PI/2 + (23/24)*6.283, a1 = a0 + (7.5/24)*6.283;
  const turn = eInOut(prog(t, 1.2, 2.4));
  const fillA = a0 + (a1-a0)*eOut(prog(t, .2, 1.2));
  ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R-14,a0,fillA); ctx.closePath();
  ctx.fillStyle = `rgba(${Math.round(lerp(30,242,turn))},${Math.round(lerp(50,193,turn))},${Math.round(lerp(110,78,turn))},${lerp(.75,.9,turn)})`;
  ctx.shadowColor = C.gold; ctx.shadowBlur = 50*turn; ctx.fill(); ctx.shadowBlur = 0;
  for (let i=0;i<24;i++){ const a=-Math.PI/2+i/24*6.283, r1 = i%6? R-26 : R-44; ctx.beginPath(); ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1); ctx.lineTo(Math.cos(a)*(R-8),Math.sin(a)*(R-8)); ctx.lineWidth = i%6?3:6; ctx.strokeStyle="rgba(255,255,255,.6)"; ctx.stroke(); }
  for (const [h,l] of [[0,"0"],[6,"6"],[12,"12"],[18,"18"]]) { const a=-Math.PI/2+h/24*6.283; txt(l, Math.cos(a)*(R-85), Math.sin(a)*(R-85)+16, 44, C.mute, {weight:700}); }
  // fast rotating hand (time flies)
  const ha = -Math.PI/2 + t*2.6;
  ctx.rotate(ha); ctx.beginPath(); ctx.moveTo(-20,0); ctx.lineTo(R-60,0); ctx.lineWidth=10; ctx.lineCap="round"; ctx.strokeStyle=C.teal; ctx.stroke();
  ctx.rotate(-ha); ctx.beginPath(); ctx.arc(0,0,16,0,6.283); ctx.fillStyle=C.teal; ctx.fill();
  ctx.restore();
  // counter
  const n = Math.round(2700*eOut(prog(t, 1.8, 3.6)));
  txt("+" + de(n), 1320, 540, 170, C.gold, {weight:900, glow:"rgba(242,193,78,.5)", blur:40, alpha: prog(t,1.6,2.0)});
  txt("Stunden pro Jahr", 1320, 630, 58, C.ink, {weight:700, alpha: prog(t,2.0,2.5)});
  txt("7,5 h × 365 Tage", 1320, 710, 40, C.mute, {weight:600, alpha: prog(t,2.4,2.9)});
});
S(11.1, 16.2, (t) => {
  tag("DAS PARADIES", W/2, 140, C.gold);
  txt("Zeit für alles.", W/2, 300, 96, C.ink, {weight:800, alpha: prog(t,0,.5)});
  const items = [["lang","Sprachen"],["music","Musik"],["travel","Reisen"],["friends","Freunde"]];
  items.forEach(([k, l], i) => {
    const p = prog(t, .5 + i*.65, 1.1 + i*.65), s = eBack(p);
    const x = 360 + i*400, y = 600 + Math.sin(t*2 + i)*8;
    ctx.save(); ctx.globalAlpha *= p; ctx.translate(x, y); ctx.scale(s, s);
    rrect(-160,-170,320,320,36); ctx.fillStyle = "rgba(255,255,255,.06)"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = i%2 ? C.tealSoft+".7)" : C.goldSoft+".7)"; ctx.stroke();
    icon(k, 0, -40, 1.25, i%2 ? C.teal : C.gold);
    txt(l, 0, 105, 46, C.ink, {weight:700});
    ctx.restore();
  });
  // filling timeline under the cards
  const f = eOut(prog(t, .4, 4.6));
  rrect(200, 830, W-400, 14, 7); ctx.fillStyle = "rgba(255,255,255,.1)"; ctx.fill();
  const lg = ctx.createLinearGradient(200,0,W-200,0); lg.addColorStop(0,C.teal); lg.addColorStop(1,C.gold);
  rrect(200, 830, (W-400)*f, 14, 7); ctx.fillStyle = lg; ctx.fill();
});

/* 3 THE CATCH 16–40 s — brain */
S(16.2, 20.2, (t) => {
  tag("DER HAKEN  ·  1  GEHIRN", W/2, 140, C.red, prog(t,0,.4));
  const pulse = 1 + .04*Math.sin(t*5);
  ctx.save(); ctx.translate(W/2 - 380, 560); ctx.scale(pulse, pulse); brain(0, 0, 1.15, t*2, .7 + .3*Math.sin(t*5), .7 + .3*Math.sin(t*5)); ctx.restore();
  // waste particles washed out
  const r = rng(7);
  for (let i=0;i<70;i++){
    const a = r()*6.283, sp = .25 + r()*.35, ph = r();
    const life = ((t*sp + ph) % 1);
    const d = 60 + life*360;
    const x = W/2 - 380 + Math.cos(a)*d*1.15, y = 560 + Math.sin(a)*d*.95;
    ctx.globalAlpha = (1-life) * prog(t, .3, 1.0);
    ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(x, y, 5 + r()*5, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  txt("Nachts putzt", 1290, 440, 84, C.ink, {weight:800, align:"center", alpha: prog(t,.2,.7)});
  txt("das Gehirn.", 1290, 535, 84, C.ink, {weight:800, align:"center", alpha: prog(t,.3,.8)});
  const n = Math.round(60*eOut(prog(t, .9, 2.4)));
  txt("+" + n + " %", 1290, 700, 120, C.gold, {weight:900, glow:"rgba(242,193,78,.5)", alpha: prog(t,.8,1.2)});
  txt("mehr Platz zum Durchspülen (bei Mäusen)", 1290, 770, 36, C.mute, {weight:600, alpha: prog(t,1.2,1.7)});
});
S(20.2, 24.2, (t) => {
  tag("DER HAKEN  ·  1  GEHIRN", W/2, 140, C.red);
  txt("17 Stunden wach ≈ 0,5 ‰", W/2, 290, 88, C.ink, {weight:800, alpha: prog(t,0,.5)});
  // chart

const SUBS = [

];
function wrap(s, maxW) {
  const words = s.split(" "), lines = []; let line = "";
  for (const w of words) { const test = line ? line + " " + w : w; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
  if (line) lines.push(line); return lines;
}
function subtitles(t) {
  for (const [a, b, s] of SUBS) {
    if (t < a || t >= b) continue;
    const al = Math.min(prog(t, a, a + .25), 1 - prog(t, b - .2, b));
    ctx.save(); ctx.globalAlpha = al;
    ctx.font = `600 42px ${FONT}`;
    const lines = wrap(s, 1500), lh = 56, boxH = lines.length*lh + 34;
    const boxW = Math.max(...lines.map(l => ctx.measureText(l).width)) + 70;
    const y = H - 40 - boxH;
    rrect(W/2 - boxW/2, y, boxW, boxH, 20); ctx.fillStyle = "rgba(3,8,20,.78)"; ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    lines.forEach((l, i) => ctx.fillText(l, W/2, y + 17 + 42 + i*lh));
    ctx.restore();
  }
}

/* ---------- master render ---------- */
const DURATION = 68.0;
function renderAt(t) {
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  background(t);
  for (const sc of SCENES) {
    const fadeIn = sc.a === 0 ? .15 : .45, fadeOut = .4;
    // crossfade: a scene keeps fading out while the next one fades in
    if (t < sc.a || t >= sc.b + fadeOut) continue;
    const lt = t - sc.a, dur = sc.b - sc.a;
    const al = Math.min(prog(lt, 0, fadeIn), sc.b === DURATION ? 1 : 1 - prog(lt, dur, dur + fadeOut));
    // gentle continuous push-in: never a still frame
    const z = 1 + .025 * (lt / dur);
    ctx.save(); ctx.globalAlpha = al;
    ctx.translate(W/2, H/2); ctx.scale(z, z); ctx.translate(-W/2, -H/2 + (1-eOut(prog(lt,0,.6)))*24);
    sc.fn(lt, dur);
    ctx.restore();
  }
  // fade to black at very end
  if (t > DURATION - .8) { ctx.fillStyle = `rgba(0,0,0,${prog(t, DURATION-.8, DURATION)})`; ctx.fillRect(0,0,W,H); }
  subtitles(t);
}
window.renderAt = renderAt; window.DURATION = DURATION; window.FPS = FPS; window.SUBS = SUBS;

/* ---------- player ---------- */
renderAt(0.0001);
if (new URLSearchParams(location.search).has("export")) document.body.classList.add("export");
let t0 = null, raf = null;
const audio = new Audio("schlaf-musik.m4a"); audio.volume = .6;
function loop(now) {
  const t = (now - t0) / 1000;
  if (t >= DURATION) { renderAt(DURATION - .001); document.getElementById("overlay").style.display = "flex"; document.getElementById("play").textContent = "↻ Nochmal"; return; }
  renderAt(t); document.getElementById("bar").style.width = (t / DURATION * 100) + "%";
  raf = requestAnimationFrame(loop);
}
document.getElementById("play").onclick = () => {
  document.getElementById("overlay").style.display = "none";
  cancelAnimationFrame(raf); t0 = performance.now();
  audio.currentTime = 0; audio.play().catch(() => {});
  raf = requestAnimationFrame(loop);
};
</script>
